<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Green Eye AI</title>

  <meta name="theme-color" content="#15803d">
  <meta name="description" content="تطبيق ذكي لتصنيف المخلفات باستخدام الذكاء الاصطناعي">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="./style.css">

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <script src="./script.js" defer></script>
</head>

<body>

  <header>
    <h1>🌱 Green Eye AI</h1>
    <p>صنّف مخلفاتك وساهم في حماية البيئة</p>
  </header>

  <main>
    <section class="upload-section">
      <h2>حلّل المخلفات بالذكاء الاصطناعي</h2>

      <label for="imageInput">اختار صورة للمخلفات</label>
      <input type="file" id="imageInput" accept="image/*">

      <div id="preview"></div>

      <div id="cropSection" style="display:none;">
        <h3>حدد العنصر الذي تريد تحليله</h3>
        <p>اسحب على الصورة لتحديد العنصر</p>
        <canvas id="cropCanvas"></canvas>

        <button id="resetCropBtn" type="button">
          إعادة تحديد العنصر
        </button>
      </div>

      <button id="analyzeBtn" type="button" disabled>
        Analyze Image
      </button>

      <div id="result"></div>

      <div id="ecoAdvice">
        <h3>♻️ النصيحة البيئية</h3>
        <p id="adviceText"></p>
      </div>
    </section>
  </main>

  <footer>
    <p>Green Eye AI © 2026</p>
    <p>Technology for a greener future 🌍</p>
  </footer>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .then(() => console.log("Service Worker registered!"))
          .catch(error => console.error("Service Worker error:", error));
      });
    }
  </script>

</body>
</html>
